    <rect x="396" y="298" width="52" height="24" rx="12" fill="#edf3ec"/><text x="422" y="314.5" font-size="12" text-anchor="middle" fill="#1c6556">16:00</text>
    <text x="460" y="310" font-size="14.5" fill="#263e34">Ginkakuji</text>
    <text x="460" y="328" font-size="11.5" font-weight="600" fill="#7b827b">Fee from the source</text>
    <use href="#tick" x="620" y="314"/>
  </g>
  <text x="396" y="352" font-size="11.5" font-weight="700" fill="#1c6556">3 sources · 1 detail to confirm</text>
</svg>
