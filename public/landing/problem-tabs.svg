      <path d="m-5 0 3.4 3.4 6.6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <style>
    text { font-family: Manrope, 'DM Sans', -apple-system, 'Segoe UI', system-ui, sans-serif; }
    .flow { stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <text x="22" y="30" font-size="12.5" font-weight="800" letter-spacing="1.6" fill="#a35a3a">BEFORE · 30 TABS</text>
  <use href="#window" transform="translate(30 62) rotate(-7)"/>
  <use href="#window" transform="translate(84 112) rotate(5)"/>
  <use href="#window" transform="translate(22 196) rotate(-3)"/>
  <text transform="translate(146 152) rotate(5)" font-size="12" font-weight="700" fill="#6e756e">Top 47 things to do!</text>

  <g font-size="14" font-weight="750" fill="#263e34">
    <g transform="translate(168 52) rotate(7)"><rect width="112" height="40" rx="6" fill="#fbecc9" filter="url(#lift)"/><text x="12" y="25">Opens 8:30<tspan fill="#b4533a">?</tspan></text></g>
    <g transform="translate(14 150) rotate(-8)"><rect width="112" height="40" rx="6" fill="#fbecc9" filter="url(#lift)"/><text x="12" y="25">Opens 9:00<tspan fill="#b4533a">?</tspan></text></g>
    <g transform="translate(176 232) rotate(5)"><rect width="108" height="40" rx="6" fill="#fbecc9" filter="url(#lift)"/><text x="12" y="25">₹ ??? / night</text></g>
    <g transform="translate(48 320) rotate(-4)"><rect width="122" height="40" rx="6" fill="#fbecc9" filter="url(#lift)"/><text x="12" y="25">Closed Mon<tspan fill="#b4533a">?</tspan></text></g>
  </g>

  <path class="flow" d="M290 206C312 196 328 196 352 206" fill="none" stroke="#1c6556" stroke-width="3" stroke-linecap="round"/>
  <path d="m346 198 9 8-11 4" fill="none" stroke="#1c6556" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(278 140) scale(.62)">
    <path d="M29 51 12 35q-5 15 0 32Z" fill="#E2AF62" stroke="#C28C47" stroke-width="2"/>
    <path d="M48 27q5-15 24-10l-1 15M48 72q5 14 23 10l-2-14" fill="#E2AF62" stroke="#C28C47" stroke-width="2"/>
    <path d="M28 50C34 21 77 15 101 48c-16 34-62 35-73 2Z" fill="#F2CD86" stroke="#C28C47" stroke-width="2.2"/>
