    <path d="M76 54q5 8 11 1" stroke="#754D30" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <text x="384" y="30" font-size="12.5" font-weight="800" letter-spacing="1.6" fill="#1c6556">AFTER · ONE PLAN</text>
