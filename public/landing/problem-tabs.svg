  <text x="396" y="84" font-size="18" font-weight="800" fill="#263e34">Day 1 · Kyoto</text>
  <text x="396" y="104" font-size="12.5" font-weight="600" fill="#7b827b">Balanced pace · vegetarian</text>
  <path d="M396 120h222" stroke="#e9e9e1" stroke-width="1.5"/>

  <g font-weight="800">
    <rect x="396" y="136" width="52" height="24" rx="12" fill="#edf3ec"/><text x="422" y="152.5" font-size="12" text-anchor="middle" fill="#1c6556">09:30</text>
    <text x="460" y="148" font-size="14.5" fill="#263e34">Kiyomizudera</text>
    <text x="460" y="166" font-size="11.5" font-weight="600" fill="#7b827b">Hours from the source</text>
    <use href="#tick" x="620" y="152"/>

    <rect x="396" y="190" width="52" height="24" rx="12" fill="#edf3ec"/><text x="422" y="206.5" font-size="12" text-anchor="middle" fill="#1c6556">12:30</text>
    <text x="460" y="202" font-size="14.5" fill="#263e34">Vegetarian lunch</text>
    <text x="460" y="220" font-size="11.5" font-weight="600" fill="#a35a3a">Menu label to confirm</text>
    <circle cx="620" cy="206" r="11" fill="#fbecc9" stroke="#e2af62" stroke-width="2"/><text x="620" y="211" font-size="14" text-anchor="middle" fill="#a35a3a">!</text>

    <rect x="396" y="244" width="52" height="24" rx="12" fill="#f6eedf"/><text x="422" y="260.5" font-size="12" text-anchor="middle" fill="#a3743a">14:15</text>
