<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Before: many browser tabs with conflicting opening hours and unknown prices. After: one day plan where each stop has a linked source and open questions are marked.">
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1c3f36" flood-opacity=".13"/>
    </filter>
    <g id="window">
      <rect width="196" height="128" rx="11" fill="#fff" stroke="#dcdfd6" stroke-width="1.5"/>
      <path d="M0 11a11 11 0 0 1 11-11h174a11 11 0 0 1 11 11v13H0Z" fill="#f1f1ec"/>
      <rect x="10" y="6" width="44" height="12" rx="4" fill="#fff"/>
      <rect x="58" y="6" width="34" height="12" rx="4" fill="#e6e6df"/>
      <rect x="96" y="6" width="34" height="12" rx="4" fill="#e6e6df"/>
      <rect x="134" y="6" width="26" height="12" rx="4" fill="#e6e6df"/>
      <rect x="14" y="40" width="120" height="7" rx="3.5" fill="#e3e6df"/>
      <rect x="14" y="56" width="160" height="6" rx="3" fill="#eef0ea"/>
      <rect x="14" y="68" width="146" height="6" rx="3" fill="#eef0ea"/>
      <rect x="14" y="80" width="152" height="6" rx="3" fill="#eef0ea"/>
      <rect x="14" y="98" width="70" height="16" rx="5" fill="#f1e2d6"/>
